[package]
name = "simulation_taps"
version = "0.1.0"
edition = "2024"

[dependencies]
taps = { path = "../TAPS" }
secp256k1 = { version = "0.28.0", features = ["rand", "global-context", "serde"] }
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3.3"